[project]
name = "chlorine"
version = "0.1.0"
description = "Chlorine residual modeling for the Arlington, TX drinking-water distribution system"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chlorine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
